[package]
name = "git-kanban"
version = "1.0.0"
edition = "2021"
description = "Terminal kanban board for Git platforms — ratatui TUI, gh/glab CLI backend, JSON cache"
license = "MIT"
homepage = "https://github.com/Feahter/git-kanban"
repository = "https://github.com/Feahter/git-kanban"
readme = "README.md"
keywords = ["kanban", "tui", "cli", "agent", "github", "gitlab", "terminal"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
